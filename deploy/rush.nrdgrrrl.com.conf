<VirtualHost *:80>
    ServerName rush.nrdgrrrl.com
    ServerAdmin webmaster@localhost

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteRule ^/\.well-known/acme-challenge/ - [L]
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=302,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/rush-error.log
    CustomLog ${APACHE_LOG_DIR}/rush-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName rush.nrdgrrrl.com
    ServerAdmin webmaster@localhost

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/rush.nrdgrrrl.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/rush.nrdgrrrl.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass /display ws://127.0.0.1:8013/display connectiontimeout=5 timeout=120
    ProxyPassReverse /display ws://127.0.0.1:8013/display
    ProxyPass /ws ws://127.0.0.1:8013/ connectiontimeout=5 timeout=120
    ProxyPassReverse /ws ws://127.0.0.1:8013/
    ProxyPass / http://127.0.0.1:8013/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:8013/

    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
    LimitRequestBody 1048576
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog ${APACHE_LOG_DIR}/rush-error.log
    CustomLog ${APACHE_LOG_DIR}/rush-access.log combined
</VirtualHost>
</IfModule>
